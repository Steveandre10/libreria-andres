<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Librería Andrés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="Estilos/main.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <div class="rail-brand"><strong>Librería Andrés</strong><span>Cultivando el saber literario</span></div>
      <blockquote>Cada libro de la tienda tiene su ficha: búscalo, léela y llévatelo a casa.</blockquote>
      <div class="tabs-preview" aria-hidden="true">
        <span style="background:var(--tab-1)"></span><span style="background:var(--tab-2)"></span><span style="background:var(--tab-3)"></span><span style="background:var(--tab-4)"></span><span style="background:var(--tab-5)"></span>
      </div>
    </aside>

    <main class="auth-main">
      <article class="ficha auth-card">
        <header class="ficha-head">
          <div class="ficha-call"><span>Ficha de lector</span><span>librería andrés</span></div>
          <h2 id="view-title">Iniciar sesión</h2>
          <p id="view-subtitle">Entra para ver el catálogo y tu carrito.</p>
        </header>
        <div class="ficha-body">
          <div id="alert-box" class="alert" role="alert">
            <i class="fas fa-exclamation-circle" id="alert-icon" aria-hidden="true"></i>
            <span id="alert-text"></span>
          </div>

          <form id="auth-form" style="margin-top:4px">
            <label class="field hidden" id="group-name">
              <span class="field-label">Nombre completo</span>
              <input type="text" id="input-name" class="input" placeholder="Tu nombre" autocomplete="name" />
            </label>
            <label class="field">
              <span class="field-label">Correo electrónico</span>
              <input type="email" id="input-email" class="input" placeholder="nombre@correo.com" required autocomplete="email" />
            </label>
            <label class="field">
              <span class="field-label">Contraseña</span>
              <input type="password" id="input-password" class="input" required autocomplete="current-password" minlength="6" />
            </label>
            <div class="auth-row" id="extra-options">
              <label><input type="checkbox" id="remember-session" /> Recordarme</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
              <span id="btn-text">Ingresar</span>
              <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </button>
          </form>

          <p class="auth-switch">
            <span id="switch-text">¿No tienes una cuenta?</span>
            <button type="button" class="link" id="switch-link">Regístrate</button>
          </p>
        </div>
      </article>
    </main>
  </div>

  <script src="login.js"></script>
</body>
</html>
