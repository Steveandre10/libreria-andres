<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil · Librería Andrés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="Estilos/main.css" />
</head>
<body>
  <div class="app">
    <nav id="rail" class="rail" data-page="perfil"></nav>

    <main class="work">
      <header class="page-head">
        <div>
          <h1>Mi perfil</h1>
          <p>Tus datos de lector en Librería Andrés.</p>
        </div>
      </header>

      <article class="ficha profile">
        <header class="ficha-head">
          <div class="ficha-call"><span id="profile-call">N.º ----</span><span id="profile-rol"></span></div>
          <h2 id="profile-nombre">Cargando…</h2>
          <p id="profile-email"></p>
        </header>
        <div class="ficha-body">
          <dl class="ficha-facts">
            <div><dt>Teléfono</dt><dd id="profile-telefono">—</dd></div>
            <div><dt>Dirección</dt><dd id="profile-direccion">—</dd></div>
            <div><dt>Lector desde</dt><dd id="profile-registro">—</dd></div>
          </dl>
        </div>
      </article>

      <!-- RF26: notificaciones por correo que el usuario decide recibir -->
      <section class="panel pref-panel">
        <div class="panel-head"><h2>Notificaciones por correo</h2></div>
        <div id="pref-notificaciones" style="padding:16px 20px"><p class="field-hint">Cargando…</p></div>
      </section>
    </main>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
