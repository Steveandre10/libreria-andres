<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nota crédito · Librería Adrián</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="Estilos/main.css" />
  <style>
    /* RF4 · Hoja de nota crédito: misma estructura que la factura, con la raya en verde (es a favor del cliente) */
    .doc-pagina { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
    .doc-barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .doc { background: #fff; border: 1px solid var(--line); border-radius: var(--r-ficha); box-shadow: var(--shadow-2); padding: 36px 40px; }
    .doc-cabecera { display: flex; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--ok); }
    .doc-marca strong { display: block; font-size: 1.5rem; font-weight: 800; font-stretch: 116%; color: var(--ink-900); }
    .doc-marca span, .doc-numero div { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-2); }
    .doc-numero { text-align: right; }
    .doc-numero h1 { font-size: var(--fs-lg); font-weight: 800; }
    .doc-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 22px 0; }
    .doc-datos h2 { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 6px; }
    .doc-datos p { font-size: var(--fs-sm); line-height: 1.6; }
    .doc .table th { position: static; }
    .doc-totales { margin-left: auto; width: min(300px, 100%); margin-top: 14px; }
    .doc-pie { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--text-3); }
    @media (max-width: 600px) { .doc { padding: 22px 18px; } .doc-cabecera { flex-direction: column; } .doc-datos { grid-template-columns: 1fr; } .doc-numero { text-align: left; } }
    @media print {
      @page { margin: 14mm; }
      body { background: #fff; }
      .no-imprimir { display: none !important; }
      .doc-pagina { padding: 0; max-width: none; }
      .doc { border: 0; box-shadow: none; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="doc-pagina">
    <div class="doc-barra no-imprimir">
      <button type="button" class="btn btn-quiet" onclick="history.length > 1 ? history.back() : window.close()"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver</button>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" id="btn-imprimir" disabled><i class="fas fa-print" aria-hidden="true"></i> Imprimir</button>
        <button type="button" class="btn btn-primary" id="btn-pdf" disabled><i class="fas fa-file-arrow-down" aria-hidden="true"></i> Descargar PDF</button>
      </div>
    </div>
    <article class="doc" id="nota"><p class="field-hint">Cargando nota crédito…</p></article>
    <p class="field-hint no-imprimir" style="margin-top:12px; text-align:center">Para descargar, en la ventana de impresión elige <b>«Guardar como PDF»</b>.</p>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    /**
     * RF4 · Nota crédito imprimible.
     * nota.html?id=1 -> abre la nota · nota.html?id=1&descargar=1 -> abre y lanza "Guardar como PDF".
     * La ve el dueño de la compra o el personal con permiso de facturas (lo controla el servidor).
     */
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const caja = document.getElementById('nota');
      const esc = window.esc;
      const fecha = (v) => v ? new Date(v).toLocaleString('es-CO', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

      try {
        const res = await window.fetchAPI(`/api/notas/${Number(params.get('id'))}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar la nota.');
        const n = data.nota;
        const numero = `NC-${String(n.id_nota).padStart(4, '0')}`;
        const facturaOriginal = n.numero_fe || window.numeroRegistro(n.id_factura);
        document.title = `Nota crédito ${numero} · Librería Adrián`;

        caja.innerHTML = `
          <header class="doc-cabecera">
            <div class="doc-marca"><strong>Librería Adrián</strong><span>Cultivando el saber literario</span></div>
            <div class="doc-numero">
              <h1>Nota ${n.tipo === 'Débito' ? 'débito' : 'crédito'} ${numero}</h1>
              <div>${fecha(n.fecha_registro)}</div>
              <div>Corrige la factura ${esc(facturaOriginal)} · Pedido ${window.numeroRegistro(n.id_pedido)}</div>
            </div>
          </header>

          <section class="doc-datos">
            <div><h2>Cliente</h2><p><b>${esc(n.cliente || '—')}</b><br>${esc(n.cliente_email || '')}<br>${n.documento_adquiriente && n.documento_adquiriente !== '222222222222' ? `C.C./NIT ${esc(n.documento_adquiriente)}` : 'Consumidor final'}</p></div>
            <div><h2>Factura original</h2><p>${esc(facturaOriginal)} del ${fecha(n.fecha_factura)}<br>Total facturado: ${window.formatPrecio(n.total_factura)}</p></div>
            <div><h2>Motivo</h2><p>${esc(n.motivo)}</p></div>
            <div><h2>Aprobada por</h2><p>${esc(n.aprobada_por || '—')}${n.estado_libro ? `<br>Estado del libro: ${esc(n.estado_libro)}` : ''}</p></div>
          </section>

          <table class="table">
            <thead><tr><th>Libro devuelto</th><th>ISBN</th><th class="right">Cant.</th><th class="right">Valor</th></tr></thead>
            <tbody>${n.lineas.map(l => `
              <tr><td><b>${esc(l.titulo || 'Libro eliminado del catálogo')}</b></td><td class="mono">${esc(l.ISBN || '—')}</td>
                  <td class="right">${l.cantidad}</td><td class="right"><b>${window.formatPrecio(l.subtotal)}</b></td></tr>`).join('')}
            </tbody>
          </table>

          <div class="doc-totales">
            <div class="summary-row"><span>Subtotal</span><span>${window.formatPrecio(n.subtotal)}</span></div>
            <div class="summary-row"><span>IVA (libros excluidos)</span><span>${window.formatPrecio(n.impuestos)}</span></div>
            <div class="summary-row total"><span>Total a favor del cliente</span><span>${window.formatPrecio(n.total)}</span></div>
          </div>

          <footer class="doc-pie">
            Esta nota ${n.tipo === 'Débito' ? 'débito aumenta' : 'crédito anula'} el valor de los libros de la factura ${esc(facturaOriginal)}.
            Según la política de la tienda, el costo del envío no se reintegra. Documento generado automáticamente por Librería Adrián al aprobar la devolución.
          </footer>`;

        ['btn-imprimir', 'btn-pdf'].forEach(id => {
          const b = document.getElementById(id);
          b.disabled = false;
          b.addEventListener('click', () => window.print());
        });
        if (params.get('descargar') === '1') setTimeout(() => window.print(), 400);
      } catch (err) {
        caja.innerHTML = `<div class="empty"><i class="fas fa-file-circle-xmark" aria-hidden="true"></i><h2>No pudimos abrir la nota</h2><p>${esc(err.message)}</p></div>`;
      }
    });
  </script>
</body>
</html>
