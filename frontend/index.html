<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Librería Adrián</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="Estilos/main.css" />
</head>
<body>
  <div class="app">
    <nav id="rail" class="rail" data-page="catalogo"></nav>

    <main class="work">
      <header class="page-head">
        <div>
          <h1 id="welcome">Hola de nuevo</h1>
          <p>Busca por título o autor, o filtra por género, precio y disponibilidad.</p>
        </div>
        <div class="actions">
          <a href="admin.html#libros" id="btn-admin-new" class="btn btn-secondary" hidden>
            <i class="fas fa-sliders" aria-hidden="true"></i> Administrar libros
          </a>
          <a href="cart.html" class="btn btn-primary cart-link">
            <i class="fas fa-bag-shopping" aria-hidden="true"></i> Ver carrito
            <span class="badge cart-count" hidden>0</span>
          </a>
        </div>
      </header>

      <!-- RF25: recomendaciones según lo que el usuario vio y compró (o los más vendidos si es nuevo) -->
      <section class="recomendados" id="recomendados" hidden aria-labelledby="reco-titulo">
        <div class="reco-head"><h2 id="reco-titulo">Recomendados para ti</h2><p id="reco-sub"></p></div>
        <div class="reco-fila" id="reco-lista"></div>
      </section>

      <div class="store-bar">
        <label class="search">
          <span class="sr-only">Buscar en el catálogo</span>
          <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="search-input" class="input" placeholder="Buscar por título o autor" autocomplete="off" />
        </label>
        <!-- RF22: filtro por rango de precio (mínimo y máximo) -->
        <div class="price-range" role="group" aria-label="Rango de precio">
          <label class="sr-only" for="precio-min">Precio mínimo</label>
          <input type="number" id="precio-min" class="input" placeholder="Precio mín." min="0" step="0.01" />
          <span aria-hidden="true">–</span>
          <label class="sr-only" for="precio-max">Precio máximo</label>
          <input type="number" id="precio-max" class="input" placeholder="Precio máx." min="0" step="0.01" />
        </div>

        <!-- RF22: mostrar solo libros con disponibilidad = 'Disponible' -->
        <label class="check">
          <input type="checkbox" id="solo-disponibles" />
          Solo disponibles
        </label>
        <span class="meta" id="catalog-meta"></span>
      </div>

      <div class="index-tabs" id="genre-tabs" role="tablist" aria-label="Géneros"></div>
      <section class="drawer-panel" aria-live="polite">
        <div class="book-grid" id="books-container">
          <div class="book" aria-hidden="true"><div class="skeleton-cover"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="book" aria-hidden="true"><div class="skeleton-cover"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="book" aria-hidden="true"><div class="skeleton-cover"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="book" aria-hidden="true"><div class="skeleton-cover"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
          <div class="book" aria-hidden="true"><div class="skeleton-cover"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
        </div>
      </section>
    </main>
  </div>

  <!-- FICHA DEL LIBRO (cajón lateral) -->
  <div class="sheet" id="book-sheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <article class="ficha">
        <header class="ficha-head">
          <div class="ficha-call"><span id="detail-call"></span><span id="detail-isbn"></span></div>
          <h2 id="detail-title"></h2>
          <p id="detail-author"></p>
          <button type="button" class="icon-btn sheet-close" data-close-sheet aria-label="Cerrar ficha"><i class="fas fa-xmark"></i></button>
        </header>
        <div class="ficha-body">
          <div class="ficha-row">
            <img id="detail-cover" class="ficha-cover" src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400" alt="" />
            <dl class="ficha-facts">
              <div><dt>Género</dt><dd id="detail-genre"></dd></div>
              <div><dt>Valoración</dt><dd id="detail-rating"></dd></div>
              <div><dt>Estado</dt><dd id="detail-status"></dd></div>
              <div><dt>Precio</dt><dd id="detail-price" class="price"></dd></div>
            </dl>
          </div>
          <p id="detail-desc" class="ficha-desc"></p>
          <div style="display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary btn-lg" id="detail-add"><i class="fas fa-bag-shopping" aria-hidden="true"></i> Añadir al carrito</button>
            <!-- RF24: favoritos -->
            <button type="button" class="btn btn-secondary btn-lg fav-detalle" id="detail-fav" aria-pressed="false"><i class="far fa-heart" aria-hidden="true"></i> <span>Agregar a favoritos</span></button>
            <a class="btn btn-secondary btn-lg" id="detail-admin-edit" hidden><i class="fas fa-pen" aria-hidden="true"></i> Editar ficha</a>
          </div>

          <section class="ficha-section">
            <h3>Reseñas de lectores</h3>
            <div class="reviews" id="detail-reviews-list"></div>

            <!-- RF29: solo quien compró el libro puede reseñarlo; aquí se explica por qué no (o el estado de su reseña) -->
            <p class="aviso-resena" id="review-estado" hidden></p>
            <form class="review-form" id="form-add-review" hidden>
              <div class="field">
                <span class="field-label" id="rating-label">Tu calificación</span>
                <div class="star-input" id="star-selector" role="radiogroup" aria-labelledby="rating-label"></div>
              </div>
              <label class="field">
                <span class="field-label">Comentario (opcional)</span>
                <textarea id="review-comment" class="textarea" placeholder="¿Qué te pareció este libro? (opcional)" maxlength="500"></textarea>
              </label>
              <div><button type="submit" class="btn btn-secondary"><i class="fas fa-paper-plane" aria-hidden="true"></i> Enviar reseña</button></div>
            </form>
          </section>
        </div>
      </article>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
