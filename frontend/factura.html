<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factura · Librería Andrés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="Estilos/main.css" />
  <style>
    /* RF7 · Hoja de factura: se ve como un documento en pantalla y se imprime limpia (A4/Carta) */
    .factura-pagina { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
    .factura-barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .factura { background: #fff; border: 1px solid var(--line); border-radius: var(--r-ficha); box-shadow: var(--shadow-2); padding: 36px 40px; position: relative; }
    .factura-cabecera { display: flex; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--red-rule); }
    .factura-marca strong { display: block; font-size: 1.5rem; font-weight: 800; font-stretch: 116%; color: var(--ink-900); }
    .factura-marca span { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-3); }
    .factura-numero { text-align: right; }
    .factura-numero h1 { font-size: var(--fs-lg); font-weight: 800; }
    .factura-numero div { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-2); }
    .factura-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 22px 0; }
    .factura-datos h2 { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 6px; }
    .factura-datos p { font-size: var(--fs-sm); line-height: 1.6; }
    .factura .table th { position: static; }
    .factura-totales { margin-left: auto; width: min(300px, 100%); margin-top: 14px; }
    .factura-totales .summary-row { padding: 5px 0; }
    .factura-pie { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--text-3); }
    .sello-anulada { position: absolute; bottom: 110px; left: 50px; transform: rotate(-10deg); font-family: var(--font-mono); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.1em; color: var(--red-rule); border: 3px solid var(--red-rule); border-radius: 6px; padding: 6px 14px; opacity: 0.85; }
    @media (max-width: 600px) { .factura { padding: 22px 18px; } .factura-cabecera, .factura-datos { grid-template-columns: 1fr; flex-direction: column; } .factura-numero { text-align: left; } }
    @media print {
      @page { margin: 14mm; }
      body { background: #fff; }
      .no-imprimir { display: none !important; }
      .factura-pagina { padding: 0; max-width: none; }
      .factura { border: 0; box-shadow: none; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="factura-pagina">
    <div class="factura-barra no-imprimir">
      <button type="button" class="btn btn-quiet" onclick="history.length > 1 ? history.back() : window.close()"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver</button>
      <button type="button" class="btn btn-primary" id="btn-pdf" disabled><i class="fas fa-file-arrow-down" aria-hidden="true"></i> Descargar PDF</button>
    </div>
    <article class="factura" id="factura"><p class="field-hint">Cargando factura…</p></article>
    <p class="field-hint no-imprimir" style="margin-top:12px; text-align:center">Para descargar, en la ventana de impresión elige <b>«Guardar como PDF»</b>.</p>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    /**
     * RF7 · Factura imprimible.
     * - factura.html?id=17            -> abre la factura
     * - factura.html?id=17&descargar=1 -> abre y lanza "Guardar como PDF"
     * El servidor solo la entrega al dueño de la compra o al personal con permiso "facturas".
     */
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const id = Number(params.get('id'));
      const caja = document.getElementById('factura');
      const esc = window.esc;
      const fecha = (v) => v ? new Date(v).toLocaleString('es-CO', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

      try {
        if (!id) throw new Error('Falta el número de la factura.');
        const res = await window.fetchAPI(`/api/facturas/${id}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar la factura.');
        const f = data.factura;
        const numero = window.numeroRegistro(f.id_factura);
        const anulada = f.estado_pedido === 'Devuelto';

        // El título es el nombre sugerido del PDF al guardarlo
        document.title = `Factura ${numero.replace('N.º ', '')} · Librería Andrés`;

        caja.innerHTML = `
          ${anulada ? '<div class="sello-anulada">ANULADA · DEVUELTO</div>' : ''}
          <header class="factura-cabecera">
            <div class="factura-marca"><strong>Librería Andrés</strong><span>Cultivando el saber literario</span></div>
            <div class="factura-numero">
              <h1>Factura de venta ${numero}</h1>
              <div>Pedido ${window.numeroRegistro(f.id_pedido)}</div>
              <div>${fecha(f.fecha_registro || f.fecha_emision)}</div>
            </div>
          </header>

          <section class="factura-datos">
            <div>
              <h2>Cliente</h2>
              <p><b>${esc(f.cliente || '—')}</b><br>${esc(f.cliente_email || '')}</p>
            </div>
            <div>
              <h2>Entrega</h2>
              <p>${esc(f.nombre_destinatario || '—')}<br>${esc(f.direccion_entrega || '')}<br>${esc(f.telefono_contacto || '')}</p>
            </div>
            <div>
              <h2>Forma de pago</h2>
              <p>${esc(f.metodo_pago || '—')}</p>
            </div>
            <div>
              <h2>Envío</h2>
              <p>${esc(f.tipo_envio || 'Coordinado con la tienda')}</p>
            </div>
          </section>

          <table class="table">
            <thead><tr><th>Libro</th><th>ISBN</th><th class="right">Cant.</th><th class="right">Precio unit.</th><th class="right">Subtotal</th></tr></thead>
            <tbody>
              ${f.lineas.map(l => `
                <tr>
                  <td><b>${esc(l.titulo || 'Libro eliminado del catálogo')}</b><div class="field-hint">${esc(l.autor || '')}</div></td>
                  <td class="mono">${esc(l.ISBN || '—')}</td>
                  <td class="right">${l.cantidad}</td>
                  <td class="right">${window.formatPrecio(Number(l.subtotal) / l.cantidad)}</td>
                  <td class="right"><b>${window.formatPrecio(l.subtotal)}</b></td>
                </tr>`).join('')}
            </tbody>
          </table>

          <div class="factura-totales">
            <div class="summary-row"><span>Subtotal</span><span>${window.formatPrecio(f.subtotal ?? f.total)}</span></div>
            <div class="summary-row"><span>IVA (libros excluidos)</span><span>${window.formatPrecio(f.impuestos ?? 0)}</span></div>
            <div class="summary-row"><span>Envío</span><span>${Number(f.costo_envio) ? window.formatPrecio(f.costo_envio) : 'Gratis'}</span></div>
            <div class="summary-row total"><span>Total</span><span>${window.formatPrecio(f.total)}</span></div>
          </div>

          <footer class="factura-pie">
            ${anulada ? '<b>Esta factura quedó anulada porque el pedido fue devuelto.</b><br>' : ''}
            Los libros están excluidos de IVA en Colombia (Ley 98 de 1993). Documento generado por Librería Andrés.
          </footer>`;

        const btn = document.getElementById('btn-pdf');
        btn.disabled = false;
        btn.addEventListener('click', () => window.print());
        if (params.get('descargar') === '1') setTimeout(() => window.print(), 400);
      } catch (err) {
        caja.innerHTML = `<div class="empty"><i class="fas fa-file-circle-xmark" aria-hidden="true"></i><h2>No pudimos abrir la factura</h2><p>${esc(err.message)}</p></div>`;
      }
    });
  </script>
</body>
</html>
